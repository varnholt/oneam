name: Build
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: Windows-x64
            configure: -A x64
          - os: windows-11-arm
            target: Windows-arm64
            configure: -A ARM64
          - os: ubuntu-24.04
            target: Linux-x64
          - os: ubuntu-24.04-arm
            target: Linux-arm64
          - os: macos-15-intel
            target: macOS-x64
          - os: macos-15
            target: macOS-arm64
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Linux window-system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.configure }}
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Regression tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        run: cmake --install build --config Release --prefix artifacts/oneam
      - name: Package archive-library source
        run: python scripts/package_archive_source.py build/_deps/sevenzip-src artifacts/oneam/oneam-archive-source.zip
      - name: Include instructions
        run: cmake -E copy README.md artifacts/oneam/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: oneam-${{ matrix.target }}
          path: artifacts/oneam/
  android:
    name: Android-${{ matrix.abi }}
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Prepare SDL bridge
        run: python3 scripts/prepare_android.py
      - name: Build installable debug APK
        working-directory: android
        run: bash ./gradlew --no-daemon assembleDebug -PoneamAbis=${{ matrix.abi }}
      - name: Package archive-library source
        run: python3 scripts/package_archive_source.py .deps/sevenzip artifacts/oneam-archive-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: oneam-Android-${{ matrix.abi }}-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            artifacts/oneam-archive-source.zip
  web:
    name: WebAssembly
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Emscripten 6.0.1
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.1
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.1
      - name: Build browser reader
        shell: bash
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release -DONEAM_BUILD_TESTS=OFF
          cmake --build build-web --parallel 4
          cmake --install build-web --prefix artifacts/oneam-web
          python3 scripts/package_archive_source.py build-web/_deps/sevenzip-src artifacts/oneam-web/oneam-archive-source.zip
      - name: Install browser test tools
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Browser integration tests
        run: |
          python3 tests/test_web.py artifacts/oneam-web
          python3 tests/test_web.py artifacts/oneam-web --without-headers
      - uses: actions/upload-artifact@v4
        with:
          name: oneam-WebAssembly
          path: artifacts/oneam-web/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/master'
        with:
          path: artifacts/oneam-web/
  preview:
    name: Publish browser preview
    if: github.ref == 'refs/heads/master'
    needs: web
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
